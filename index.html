<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framingham 心血管風險評估</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
}
input,select{
    width:100%;
    padding:8px;
    margin-top:5px;
    margin-bottom:10px;
}
button{
    background:#1976d2;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;
}
.result{
    margin-top:20px;
    padding:15px;
    background:#f5f5f5;
    border-radius:8px;
}
.low{color:green;}
.medium{color:orange;}
.high{color:red;}
</style>

</head>
<body>

<h2>Framingham 十年心血管疾病風險評估</h2>

<label>年齡</label>
<input type="number" id="age">

<label>性別</label>
<select id="sex">
<option>男</option>
<option>女</option>
</select>

<label>總膽固醇 (mmol/L)</label>
<input type="number" step="0.1" id="tc">

<label>HDL-C (mmol/L)</label>
<input type="number" step="0.1" id="hdl">

<label>收縮壓 SBP (mmHg)</label>
<input type="number" id="sbp">

<label>接受降壓治療？</label>
<select id="treated">
<option>否</option>
<option>是</option>
</select>

<label>吸煙？</label>
<select id="smoker">
<option>否</option>
<option>是</option>
</select>

<label>糖尿病？</label>
<select id="diabetes">
<option>否</option>
<option>是</option>
</select>

<br><br>

<button onclick="calculate()">
計算風險
</button>

<div id="result" class="result"></div>

<script>

function calculate(){

let age=Number(document.getElementById("age").value);
let sex=document.getElementById("sex").value;
let tc=Number(document.getElementById("tc").value);
let hdl=Number(document.getElementById("hdl").value);
let sbp=Number(document.getElementById("sbp").value);

let treated=
document.getElementById("treated").value==="是";

let smoker=
document.getElementById("smoker").value==="是";

let diabetes=
document.getElementById("diabetes").value==="是";

let risk;

if(sex==="男"){

let score=
(3.06117*Math.log(age))
+(1.12370*Math.log(tc))
-(0.93263*Math.log(hdl))
+((treated?1.99881:1.93303)*Math.log(sbp))
+(smoker?0.65451:0)
+(diabetes?0.57367:0)
-20.6443;

risk=
100*(1-Math.pow(
0.88936,
Math.exp(score)
));

}else{

let score=
(2.32888*Math.log(age))
+(1.20904*Math.log(tc))
-(0.70833*Math.log(hdl))
+((treated?2.82263:2.76157)*Math.log(sbp))
+(smoker?0.52873:0)
+(diabetes?0.69154:0)
-21.5769;

risk=
100*(1-Math.pow(
0.95012,
Math.exp(score)
));

}

risk=Math.max(0,Math.min(100,risk));

let level="";
let color="";

if(risk<10){
level="低風險";
color="low";
}
else if(risk<20){
level="中風險";
color="medium";
}
else{
level="高風險";
color="high";
}

document.getElementById("result").innerHTML=
`
<h3>結果</h3>

<p><strong>10年心血管疾病風險:</strong>
${risk.toFixed(1)}%</p>

<p class="${color}">
<strong>${level}</strong>
</p>
`;

}

</script>

</body>
</html>
